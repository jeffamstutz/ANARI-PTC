# Compile project on Ubuntu
name: Ubuntu
on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      # explicit include-based build matrix, of known valid options
      matrix:
        include:
          - os: ubuntu-24.04
            gcc: 13
          - os: ubuntu-22.04
            gcc: 11
          - os: ubuntu-22.04
            gcc: 10
          - os: ubuntu-20.04
            gcc: 10
          - os: ubuntu-20.04
            gcc: 9
    env:
      build_dir: "build"
      config: "Release"

    steps:
    - uses: actions/checkout@v3

    # Specify the correct host compilers
    - name: Install/Select gcc and g++ 
      run: |
        sudo apt-get install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }}
        echo "CC=/usr/bin/gcc-${{ matrix.gcc }}" >> $GITHUB_ENV
        echo "CXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV

    - name: Build/Install MPI
      run: sudo apt-get install -y libopenmpi-dev
      shell: bash

    - name: Build/Install ANARI SDK
      run: |
        sudo apt-get install -y libtbb-dev
        git clone https://github.com/KhronosGroup/ANARI-SDK -b v0.11.1
        cd ANARI-SDK
        mkdir builddir
        cmake . -B builddir -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_HELIDE_DEVICE=OFF -DBUILD_EXAMPLES=OFF
        cmake --build builddir        
        sudo cmake --install builddir        
      shell: bash

    - name: Configure cmake
      id: configure
      run: cmake . -B ${{ env.build_dir }} -DCMAKE_BUILD_TYPE=${{ env.config }}

    - name: Configure Error Processing
      if: ${{ failure() && steps.configure.outcome == 'failure' }}
      run: |
          if [[ -d "${{ env.build_dir }}" ]]; then
            pushd "${{ env.build_dir }}"
            if [[ -f "CMakeFiles/CMakeOutput.log" ]]; then
              echo "---- CMakeFiles/CMakeOutput.log"
              cat CMakeFiles/CMakeOutput.log
              echo "----"
            fi
            if [[ -f "CMakeFiles/CMakeError.log" ]]; then
              echo "---- CMakeFiles/CMakeError.log"
              cat CMakeFiles/CMakeError.log
              echo "----"
            fi
          fi



    - name: Build everything else
      working-directory: ${{ env.build_dir }}
      run: cmake --build . --target all --verbose -j `nproc`

